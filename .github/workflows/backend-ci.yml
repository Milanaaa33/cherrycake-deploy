name: Backend CI

on:
  push:
    branches: [master]
    paths: ['cherrycake-backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [master]
    paths: ['cherrycake-backend/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: cherrycake-backend/pom.xml
      - name: Build and test backend
        working-directory: cherrycake-backend
        run: mvn --batch-mode clean verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: cherrycake-backend/target/surefire-reports/
