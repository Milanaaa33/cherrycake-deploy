spring:
  application:
    name: cherrycake-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # V3 (catalog seed) can reach master before V2 (orders); this lets V2 still run on databases that already have V3.
    out-of-order: true

springdoc:
  paths-to-match: /api/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
