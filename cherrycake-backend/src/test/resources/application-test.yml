spring:
  datasource:
    url: jdbc:h2:mem:cherrycake;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""

# Preserve agreed endpoint contract assertions for ApiContractTests under test profile
springdoc:
  paths-to-match: /api/regions,/api/categories,/api/products,/api/products/*,/api/cart/calculate,/api/orders,/api/orders/my,/api/orders/my/claim,/api/pickup-points,/api/delivery-zones,/api/time-slots,/api/auth/*,/api/reports/**
